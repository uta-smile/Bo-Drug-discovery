[project]
name = "molbo"
version = "0.1.0"
description = "Sample-efficient molecular Bayesian optimization with LLM-derived constraints"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "rdkit>=2024.3.1",
    "requests>=2.31",
    "tqdm>=4.66",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# PyTDC must be installed with --no-deps: it pulls tiledbsoma (single-cell
# data, needs a build toolchain) which nothing here uses. These are the deps
# tdc.Oracle actually needs. setuptools is pinned because 81+ dropped
# pkg_resources, which tdc.metadata imports.
pmo = [
    "PyTDC==0.4.17",
    "fuzzywuzzy>=0.18",
    "seaborn>=0.13",
    "setuptools<81",
    "mygene>=3.2",
    "huggingface_hub>=0.20",
    "networkx>=3.0",
    "biopython>=1.81",
]
# The surrogate is an exact Tanimoto GP in numpy (src/molbo/surrogate.py), so
# torch is NOT needed for the primary tier. This extra exists only to compare
# against a BoTorch baseline.
bo = ["torch>=2.2", "gpytorch>=1.11", "botorch>=0.11"]
llm = ["anthropic>=0.40"]
# boltz itself is installed separately (it needs a matching CUDA torch build);
# pyyaml is what molbo uses to round-trip the prediction inputs.
boltz = ["pyyaml>=6.0"]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/molbo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
