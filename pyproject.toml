[project]
name = "molbo"
version = "0.1.0"
description = "Molecular Bayesian optimization diagnostics for auxiliary assay data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "rdkit>=2024.3.1",
    "requests>=2.31",
    "tqdm>=4.66",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# The surrogate is an exact Tanimoto GP in numpy (src/molbo/surrogate.py), so
# torch is NOT needed for the primary tier. This extra exists only to compare
# against a BoTorch baseline.
bo = ["torch>=2.2", "gpytorch>=1.11", "botorch>=0.11"]
llm = ["anthropic>=0.40"]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/molbo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
